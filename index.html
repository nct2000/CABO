<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>CABO</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#060d1c;--pn:#0c1830;--ln:#8da4c8;--tx:#e8f0ff;--dim:#b4c4e2;--gd:#f2b632;--ok:#4ade80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:700 16px/1.45 "Num","Silkscreen",ui-monospace,Consolas,monospace}
@font-face{font-family:"Num";font-weight:100 900;src:local("Consolas"),local("Menlo"),local("SF Mono"),local("DejaVu Sans Mono"),local("Roboto Mono"),local("Courier New");unicode-range:U+0030-0039}header{display:flex;align-items:baseline;gap:18px;padding:10px 16px;flex-wrap:wrap}
h1{margin:0;font-size:40px;letter-spacing:3px}header span{color:var(--dim);letter-spacing:2px;font-size:14px}header i{margin-left:auto;font-style:normal}
.wrap{display:grid;grid-template-columns:1fr 250px;gap:12px;padding:0 12px 16px;max-width:1180px;margin:auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.box{background:var(--pn);border:3px solid var(--ln);border-radius:6px;padding:10px}
#opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}
.pn{display:grid;grid-template-columns:44px 1fr auto;gap:6px 8px;background:var(--pn);border:3px solid color-mix(in srgb,var(--ac) 55%,#456);border-radius:6px;padding:8px;align-items:start}
.pn.cur{border-color:var(--gd);box-shadow:0 0 0 2px #f2b63255}
.av{width:44px;height:44px;background:var(--ac);border:3px solid #ffffff55;border-radius:6px;display:grid;place-items:center;font-size:24px;color:#0006}
.nm{align-self:center;font-weight:700;letter-spacing:1px}.nm small{color:var(--dim)}
.hand{grid-column:1/3;grid-row:2;display:flex;flex-wrap:wrap;gap:6px}.pn:not(.you) .hand{max-width:172px}
.dp{grid-column:3;grid-row:1/3}
.dp{display:flex;flex-direction:column;align-items:center;gap:2px}.dp small{color:var(--dim);font-size:13px}
.you{margin-top:10px}.you .hand{grid-column:1/3;grid-row:2}.you .dp{grid-row:1/3}
.tag{background:var(--gd);color:#000;padding:0 5px;font-size:12px}
.c{width:112px;height:157px;border-radius:6px;position:relative;flex:none}.c.sm{width:80px;height:112px}.c.dc{width:92px;height:129px}@media(max-width:520px){.c{width:78px;height:109px}.c.sm{width:60px;height:84px}.c.dc{width:64px;height:90px}}
.c img{width:100%;height:100%;display:block}
.bk{background:#0b1a38;border:3px solid #cfe0ff}.bk:after{content:"";position:absolute;inset:26% 24%;border:3px solid #cfe0ff;transform:rotate(45deg) scale(.7)}
.em{border:2px dashed #3a5078}
.cl{cursor:pointer;outline:3px dashed var(--gd);outline-offset:2px}.sel{transform:translateY(-9px);outline:3px solid var(--gd)}
.felt{border:4px solid #3b507a;border-radius:90px;background:radial-gradient(#0f2142,#0a1630);padding:18px 24px;display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:210px}
.col{text-align:center;color:var(--dim);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px}.col b{color:var(--tx);font-size:20px}
.say{min-width:220px;max-width:340px;text-align:center}.say p{margin:0 0 8px}.lg{color:var(--dim);font-size:14px;margin-top:6px}
button{font:inherit;font-weight:700;background:var(--gd);color:#16110a;border:0;border-bottom:4px solid #9a6d0b;border-radius:4px;padding:8px 14px;margin:3px;cursor:pointer;letter-spacing:1px}
button.g{background:#26395c;color:var(--tx);border-bottom-color:#14213a}button:disabled{opacity:.4}
input,select{font:inherit;background:#0a1428;color:var(--tx);border:2px solid var(--ln);border-radius:4px;padding:7px 10px;width:100%;margin:4px 0}
.st{display:flex;gap:10px;align-items:center;padding:8px;margin:6px 0;border:2px solid #31466c;border-radius:6px;color:var(--dim)}
.st b{width:30px;height:30px;display:grid;place-items:center;background:#26395c;color:var(--tx);border-radius:4px}
.st.on{border-color:var(--gd);color:var(--tx)}.st.on b{background:var(--gd);color:#000}
.gd{margin:9px 0;font-size:16px;color:var(--tx)}.gd b{color:var(--gd)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #31466c;text-align:left}tr.w td{color:var(--gd)}
.big{font-size:34px;color:var(--gd);letter-spacing:3px;margin:2px 0 8px}.pl{display:flex;justify-content:space-between;padding:10px;border:2px solid #31466c;border-radius:6px;margin:6px 0}
.ok{color:var(--ok)}.big2{max-width:520px;margin:20px auto}
</style></head><body>

/* ---------- host game engine ---------- */
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(){const d=[];let id=0;for(const s of SU)RK.forEach(r=>d.push({id:id++,r,s,v:r=='K'?(s=='V'?0:13):r=='A'?1:r=='J'?11:r=='Q'?12:+r}));return sh(d)}
const eff=c=>'789'.includes(c.r)&&c.r.length==1||(c.r=='K'&&c.s!='V');
const key=c=>c.r=='K'?'K'+c.s:c.r,lab=c=>c.r+' of '+SN[c.s],lg=t=>G.log.push(t);
const idxs=p=>G.P[p].s.map((c,i)=>c?i:-1).filter(i=>i>=0);
const low=p=>idxs(p).reduce((b,i)=>b<0||G.P[p].s[i].v<G.P[p].s[b].v?i:b,-1);
const tot=p=>G.P[p].s.reduce((a,c)=>a+(c?c.v:0),0);
function swap(a,i,b,j){const x=G.P[a].s[i],y=G.P[b].s[j];G.P[a].s[i]=y;G.P[b].s[j]=x;x.k=y.k=false}
function shuf(p){sh(G.P[p].s);G.P[p].s.forEach(c=>c&&(c.k=false))}
function put(p,i,c){const o=G.P[p].s[i];G.P[p].s[i]=c;c.k=true;G.P[p].d.push(o);lg(G.P[p].n+' keeps the new card, discards '+lab(o))}
function startHost(){const n=Math.max(L.p.length,+$('#ns').value);G={P:[],tot:[],round:1};
L.p.forEach(p=>G.P.push({n:p.n,bot:0,pid:p.pid}));for(let i=0;G.P.length<n;i++)G.P.push({n:BN[i],bot:1});deal();bc()}
function deal(){const d=G.deck=mk();G.P.forEach(p=>{p.s=[0,1,2,3].map(()=>{const c=d.pop();c.k=false;return c});p.d=[];if(p.bot)sh([0,1,2,3]).slice(0,2).forEach(i=>p.s[i].k=true)});
Object.assign(G,{cur:(G.round-1)%G.P.length,cabo:-1,left:0,drawn:null,over:false,busy:false,sel:{},rev:{},pk:{},log:[],ph:'peek0',msg:'',x:null,why:''})}
const vis=(c,i)=>c?(G.over||(G.rev[i]||[]).includes(c.id)?[c.r,c.s]:0):null;
function view(i){const cur=G.cur;let m=G.msg;if(G.ph=='peek0')m=!G.pk[i]?'Setup: tap 2 of your 4 cards to peek. Positions never change.':G.pk[i]==1?'Memorize them, then hide.':'Waiting for the other players…';else if(G.ph!='over'&&i!=cur)m=G.P[cur].n+' is playing…';
return{me:i,c:cur,h:G.ph,k:G.kind,st:G.step,cb:G.cabo,o:G.over,dn:G.deck.length,m,lg:G.log.slice(-3),d:G.drawn?(i==cur?[G.drawn.r,G.drawn.s]:0):null,sel:G.sel[i]||[],pk:G.pk[i]||0,rd:G.round,tt:G.tot,
p:G.P.map((q,j)=>({n:q.n,s:q.s.map(c=>vis(c,i)),t:q.d.length?[q.d[q.d.length-1].r,q.d[q.d.length-1].s]:null,x:G.over?G.x[j]:undefined,b:G.over?G.b[j]:undefined}))}}
function bc(){G.P.forEach((p,i)=>!p.bot&&R.emit('sync',{to:p.pid,v:view(i)}))}
const prevP=()=>G.P[(G.cur+G.P.length-1)%G.P.length];
function startTurn(){G.drawn=null;G.sel={};G.rev={};G.busy=!!G.P[G.cur].bot;
if(G.busy){G.ph='bot';G.msg='';bc();setTimeout(bot,900)}else{G.ph='start';G.msg='Draw from the pile, or take the top card of '+prevP().n+"'s discard.";bc()}}
function endTurn(called){if(G.cabo>=0&&!called&&--G.left<=0)return finish('cabo');if(!G.deck.length)return finish('empty');
G.cur=(G.cur+1)%G.P.length;if(G.cur==G.cabo)G.cur=(G.cur+1)%G.P.length;startTurn()}
function callCabo(p){G.cabo=p;G.left=G.P.length-1;lg(G.P[p].n+' calls CABO! Everyone else gets one last turn.')}
function finish(w){G.over=true;G.ph='over';G.busy=false;const x=G.x=G.P.map((_,i)=>tot(i)),m=Math.min(...x);G.b=x.slice();let r='';if(w=='cabo'){const c=G.P[G.cabo].n;if(x[G.cabo]==m){x[G.cabo]=0;r=c+' called CABO correctly: round score 0. '}else{x[G.cabo]+=10;r=c+' called CABO wrongly: +10 penalty. '}}else r='The draw pile ran out. ';x.forEach((v,i)=>G.tot[i]=(G.tot[i]||0)+v);
r+='Lowest this round: '+G.P.filter((_,i)=>x[i]==Math.min(...x)).map(p=>p.n).join(', ')+'.';

G.msg=r;bc()}
function onAct(m){if(!host||!G)return;const i=G.P.findIndex(p=>p.pid==m.peer);if(i<0)return;const d=m.data||{};act(i,d.a,+d.p,+d.s)}
function setDisc(){G.ph='disc';G.sel[G.cur]=[];G.msg='Replace one card, discard several that share a number, or discard the drawn card.'}
function act(m,a,p,s){const me=G.P[m],sel=()=>G.sel[m]||(G.sel[m]=[]),tg=(q,i)=>{const k=q.indexOf(i);k<0?q.push(i):q.splice(k,1)};
if(G.ph=='peek0'){if(a=='slot'&&p==m&&!G.pk[m]&&me.s[s]){const q=sel();tg(q,s);if(q.length==2){G.rev[m]=q.map(i=>me.s[i].id);G.pk[m]=1}}
else if(a=='hide'&&G.pk[m]==1){G.rev[m]=[];G.sel[m]=[];G.pk[m]=2;if(G.P.every((q,i)=>q.bot||G.pk[i]==2))return startTurn()}return bc()}
if(G.ph=='over'){if(a=='again'&&m==0){G.round++;deal();bc()}return}
if(m!=G.cur||G.busy)return;const d=G.drawn,ph=G.ph;
if(a=='slot'){const t=ph=='tgt'?STEPS[G.kind][G.step]:'';
if(ph=='disc'&&p==m&&me.s[s])tg(sel(),s);
else if(ph=='tgt'&&G.P[p]&&G.P[p].s[s]&&(t=='o'?p==m:t=='x'?p!=m:true)){if(G.step==0)G.t=[p,s];if(G.step<STEPS[G.kind].length-1){G.step++;G.msg="Now pick the other player's card."}else target(m,p,s)}
return bc()}
if(a=='draw'&&ph=='start'){const c=G.deck.pop();G.drawn=c;lg(me.n+' draws from the pile');if(eff(c)){G.ph='eff';G.kind=key(c);G.msg='You drew '+lab(c)+'. Effect: '+DESC[G.kind]+'. Use it?'}else setDisc()}
else if(a=='take'&&ph=='start'&&p==(m+G.P.length-1)%G.P.length&&prevP().d.length){const c=G.drawn=prevP().d.pop();lg(me.n+' takes '+lab(c)+' from '+prevP().n+"'s discard");setDisc()}
else if(a=='use'&&ph=='eff'){G.ph='tgt';G.step=0;G.msg={7:'Tap one of your cards.',8:'Tap a card of another player.',9:'First tap one of your cards.',KF:'Tap any card of the player to check.',KC:'First tap one of your cards.',KM:'Tap any card of the player to shuffle.'}[G.kind]}
else if(a=='skip'&&ph=='eff')setDisc();
else if(a=='ack'&&ph=='ack'){G.rev={};setDisc()}
else if(a=='drop'&&ph=='disc'){me.d.push(d);lg(me.n+' discards '+lab(d));G.drawn=null;G.ph='cabo';G.msg='Step 4: call CABO, or end your turn.'}
else if(a=='conf'&&ph=='disc'&&sel().length){const k=sel();
if(k.length==1)put(m,k[0],d);
else if(k.every(i=>me.s[i].v==me.s[k[0]].v)){k.forEach(i=>me.d.push(me.s[i]));me.s[k[0]]=d;k.slice(1).forEach(i=>me.s[i]=null);lg(me.n+' discards '+k.length+' matching cards and keeps '+lab(d))}
else{me.s.push(d);lg('Not matching! '+me.n+' keeps every card plus the drawn one.')}
G.drawn=null;G.sel={};G.ph='cabo';G.msg='Step 4: call CABO, or end your turn.'}
else if(a=='cabo'&&ph=='cabo'&&G.cabo<0){callCabo(m);return endTurn(true)}
else if(a=='end'&&ph=='cabo')return endTurn(false);
bc()}
function target(m,p,s){const k=G.kind,P=G.P,c=P[p].s[s];let t;
if(k=='7'||k=='8'){G.rev[m]=[c.id];t=(k=='7'?'Your card: ':P[p].n+"'s card: ")+lab(c)+' (value '+c.v+')'}
if(k=='9'){swap(m,G.t[1],p,s);t='Swapped your card with '+P[p].n+"'s card.";lg(P[m].n+' swaps a card with '+P[p].n)}
if(k=='KC'){swap(m,G.t[1],p,low(p));t='Swapped your card with '+P[p].n+"'s lowest card.";lg(P[m].n+' swaps with '+P[p].n+"'s lowest card")}
if(k=='KF'){t=P[p].n+"'s cards total "+tot(p)+'.';lg(P[m].n+' checks '+P[p].n+"'s total")}
if(k=='KM'){shuf(p);t=P[p].n+"'s cards were shuffled.";lg(P[m].n+' shuffles '+P[p].n+"'s cards")}
G.msg=t;G.ph='ack'}
function bot(){const n=G.P.length,me=G.cur,p=G.P[me],prev=G.P[(me+n-1)%n],top=prev.d[prev.d.length-1];
const worst=()=>{let b=-1;p.s.forEach((c,i)=>{if(c&&c.k&&(b<0||c.v>p.s[b].v))b=i});return b};
const unk=()=>p.s.map((c,i)=>c&&!c.k?i:-1).filter(i=>i>=0);let c,fd=false,w=worst();
if(top&&top.v<=3&&((w>=0&&p.s[w].v>top.v)||unk().length)){c=prev.d.pop();lg(p.n+' takes '+lab(c)+' from '+prev.n+"'s discard")}else{c=G.deck.pop();fd=true;lg(p.n+' draws from the pile')}
if(fd&&eff(c)){const k=key(c),os=G.P.map((_,i)=>i).filter(i=>i!=me),o=os[Math.random()*os.length|0],ri=idxs(o)[Math.random()*idxs(o).length|0];
if(k=='7'&&unk().length){p.s[unk()[0]].k=true;lg(p.n+' peeks at own card')}
else if(k=='8')lg(p.n+' spies on '+G.P[o].n)
else if(k=='9'&&w>=0&&p.s[w].v>=7){swap(me,w,o,ri);lg(p.n+' swaps a card with '+G.P[o].n)}
else if(k=='KC'&&w>=0&&p.s[w].v>=8){swap(me,w,o,low(o));lg(p.n+' swaps with '+G.P[o].n+"'s lowest card")}
else if(k=='KF')lg(p.n+' checks '+G.P[o].n+"'s total")
else if(k=='KM'&&Math.random()<.5){shuf(o);lg(p.n+' shuffles '+G.P[o].n+"'s cards")}
w=worst()}
const u=unk();if(w>=0&&c.v<p.s[w].v)put(me,w,c);else if(c.v<=4&&u.length)put(me,u[Math.random()*u.length|0],c);else{p.d.push(c);lg(p.n+' discards '+lab(c))}
const est=p.s.reduce((a,x)=>a+(x?(x.k?x.v:6.5):0),0);
if(G.cabo<0&&est<=12&&Math.random()<.5){callCabo(me);return endTurn(true)}
bc();setTimeout(()=>endTurn(false),700)}
/* ---------- client rendering ---------- */
function cardEl(x,o={}){const c=o.cl?` data-a="${o.a||'slot'}" data-p="${o.p}" data-s="${o.s}"`:'',cls='c'+(o.sm?' sm':'')+(o.dc?' dc':'')+(o.cl?' cl':'')+(o.sel?' sel':'');
if(x==null)return`<div class="${cls} em"></div>`;return x===0?`<div class="${cls} bk"${c}></div>`:`<div class="${cls}"${c}><img alt="${x[0]} of ${SN[x[1]]}" src="${img(x[0],x[1])}"></div>`}
const guide=()=>`<div class="box"><b>SPECIAL CARD GUIDE</b>${GUIDE.map(g=>`<div class="gd"><b>${g[0]}</b> ${g[3]}</div>`).join('')}<div class="gd">Effects work only on a card drawn from the draw pile.</div></div>`;
function flow(h){const on={start:0,eff:1,tgt:1,ack:1,disc:2,cabo:3}[h],T=['Draw','Effect / Discard','Place face down','Call CABO'];return`<div class="box"><b>TURN FLOW</b>${T.map((t,i)=>`<div class="st ${on===i?'on':''}"><b>${i+1}</b>${t}</div>`).join('')}</div>`}
function render(){const A=$('#app');$('#rnd').textContent=V&&mode=='game'?'ROUND '+V.rd:'';
if(mode=='menu'){A.innerHTML=`<div class="box big2"><p>Your name</p><input id="nm" maxlength="12" value="${esc(name)}" placeholder="Player"><button data-a="create">Create room</button><hr><p>Room code</p><input id="cd" placeholder="cabo-xxx"><button data-a="join" class="g">Join room</button><hr><button data-a="solo" class="g">Play solo vs bots</button><p style="color:var(--dim);font-size:13px">Friends open this same page and enter the room code. The host must keep the page open.</p></div>`;return}
if(mode=='lobby'){const me=L.p.find(p=>p.pid==myPid);A.innerHTML=`<div class="wrap"><div class="box"><p style="margin:0;color:var(--dim)">ROOM</p><div class="big">${esc(L.code||'solo')}</div><button class="g" data-a="copy">Copy code</button>${L.p.map(p=>`<div class="pl"><span>${esc(p.n)}${p.pid==myPid?' (you)':''}</span><span class="ok">● READY</span></div>`).join('')}
${host?`<p>Seats (bots fill empty ones)</p><select id="ns">${[2,3,4,5,6].map(n=>`<option ${n==4?'selected':''}>${n}</option>`).join('')}</select><p style="color:var(--dim)">Scoring: lowest total leads. Correct CABO = 0 for the round. Wrong CABO = your cards + 10.</p><button data-a="start">▶ Start game</button>`:'<p>Waiting for the host to start…</p>'}</div>${guide()}</div>`;return}
if(!V)return;const v=V,me=v.me,n=v.p.length,mine=v.c==me&&!v.o,h=v.h,prev=(me+n-1)%n;
const can=(p,s)=>{if(v.p[p].s[s]==null||v.o)return false;if(h=='peek0')return p==me&&v.pk==0;if(!mine)return false;if(h=='disc')return p==me;if(h=='tgt'){const t=STEPS[v.k][v.st];return t=='o'?p==me:t=='x'?p!=me:true}return false};
const panel=i=>{const q=v.p[i],you=i==me,take=mine&&h=='start'&&i==prev&&q.t;
return`<div class="pn ${you?'you':''} ${v.c==i&&!v.o&&h!='peek0'?'cur':''}" style="--ac:${COL[i%6]}"><div class="av">${GL[i%6]}</div><div class="nm">${you?'YOU':esc(q.n)}${v.cb==i?' <b class="tag">CABO</b>':''}${q.x!=null?' <small>'+q.x+'</small>':''}</div>
<div class="hand">${q.s.map((x,s)=>cardEl(x,{cl:can(i,s),p:i,s,sel:you&&v.sel.includes(s)&&h!='tgt',sm:!you})).join('')}</div>
<div class="dp"><small>discard${take?' · take':''}</small>${q.t?cardEl(q.t,{dc:1,cl:take,a:'take',p:i,s:0}):'<div class="c dc em"></div>'}</div></div>`};
let b='';if(h=='peek0'&&v.pk==1)b='<button data-a="hide">Hide and start</button>';
if(mine){if(h=='eff')b='<button data-a="use">▶ Use effect</button><button class="g" data-a="skip">Skip effect</button>';
if(h=='ack')b='<button data-a="ack">OK</button>';
if(h=='disc')b=`<button data-a="conf" ${v.sel.length?'':'disabled'}>${v.sel.length>1?'Discard matching':'Replace selected'}</button><button class="g" data-a="drop">Discard drawn</button>`;
if(h=='cabo')b=(v.cb<0?'<button data-a="cabo">Call CABO</button>':'')+'<button class="g" data-a="end">End turn</button>'}
if(v.o&&me==0)b='<button data-a="again">▶ Next round</button>';
let mid;if(v.o){const o=v.p.map((q,i)=>i).sort((a,c)=>v.tt[a]-v.tt[c]);mid=`<div class="box" style="width:100%"><b>ROUND RESULTS</b><table><tr><th>#</th><th>Player</th><th>Cards</th><th>Round</th><th>Total</th></tr>${o.map((i,k)=>`<tr class="${v.tt[i]==v.tt[o[0]]?'w':''}"><td>${k+1}</td><td>${esc(v.p[i].n)}</td><td>${v.p[i].b}</td><td>${v.p[i].x}</td><td>${v.tt[i]}</td></tr>`).join('')}</table><p>${esc(v.m)}</p>${b}</div>`}
else mid=`<div class="col">DRAW PILE<b>${v.dn}</b>${cardEl(v.dn?0:null,{cl:mine&&h=='start',a:'draw',p:0,s:0})}</div>${v.d!==null?`<div class="col">${mine?'YOU DREW':esc(v.p[v.c].n)+' DREW'}${cardEl(v.d,{})}</div>`:''}<div class="say"><p>${esc(v.m)}</p>${b}<div class="lg">${v.lg.map(esc).join('<br>')}</div></div>`;
A.innerHTML=`<div class="wrap"><div><div id="opps">${Array.from({length:n-1},(_,k)=>panel((me+1+k)%n)).join('')}</div><div class="felt">${mid}</div>${panel(me)}</div><aside>${flow(mine?h:'')}<br>${guide()}</aside></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
if(a=='create'||a=='join'||a=='solo'){name=($('#nm').value||'Player').trim().slice(0,12);
if(a=='join'){code=$('#cd').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(!code)return}
else{host=true;code=a=='solo'?'':'cabo-'+Math.random().toString(36).slice(2,5)}
L={code,p:[]};mode='lobby';conn(a=='solo'?'':code);render();return}
if(a=='start')return startHost();
if(a=='copy'){try{navigator.clipboard.writeText(code)}catch(x){}return}
if(R&&mode=='game')send(a,+t.dataset.p,+t.dataset.s)});
render();
</script></body></html>
